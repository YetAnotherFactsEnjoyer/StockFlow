name: stockflow-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/init_env.py first}
    volumes:
      - stockflow-postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockflow_user -d stockflow']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/stockflow
      DATABASE_USERNAME: stockflow_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/init_env.py first}
      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/init_env.py first}
      JWT_ISSUER: ${JWT_ISSUER:-stockflow}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      SERVER_PORT: 8080
    ports:
      - '127.0.0.1:8082:8080'

volumes:
  stockflow-postgres:
